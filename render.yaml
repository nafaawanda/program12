services:
  - type: web
    name: program12
    env: php
    phpVersion: '8.2'
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:clear
      php artisan cache:clear
    startCommand: |
      php artisan config:cache && php artisan route:cache && php artisan view:cache
    healthCheckPath: /ping
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://program12.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: program12-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: program12-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: program12-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: program12-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: program12-db
          property: password

  - type: mysql
    name: program12-db
    plan: free
